
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reina del Flow - Temporada 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
</head>
<body class="has-page-bg">
    <div class="page-bg" aria-hidden="true"></div>
    <div id="site-header"></div>
    <main>
        <section class="hero" aria-label="Portada">
            <div class="hero__overlay"></div>
            <div class="hero__content container">
                <h1 class="hero__title">Temporada 3</h1>
                <div class="hero__meta">REINA DEL FLOW</div>
                <p class="hero__desc">
                    Episodios de la Temporada 3.
                </p>
                <div class="hero__social" aria-label="Navegación">
                    <a class="social" href="index.html" aria-label="Volver al inicio">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path fill="currentColor" d="M14.7 6.3a1 1 0 0 1 0 1.4L10.4 12l4.3 4.3a1 1 0 1 1-1.4 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.4 0z"/>
                        </svg>
                    </a>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="container content__inner">
                <h2 class="content__title">Episodios</h2>
                <p class="content__lead">Selecciona un episodio para reproducirlo.</p>

                <div class="seasons" id="seasonEpisodes" role="list"></div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            async function renderEpisodes() {
                const seasonEpisodes = document.getElementById('seasonEpisodes');
                if (!seasonEpisodes) {
                    return;
                }

                const res = await fetch('data/episodes.json', { cache: 'no-store' });
                const data = await res.json();

                const season = '3';
                const seasonData = data && data.seasons && data.seasons[season];
                const list = seasonData && Array.isArray(seasonData.episodes) ? seasonData.episodes : [];

                seasonEpisodes.innerHTML = '';
                list.forEach((episode) => {
                    if (!episode || typeof episode.number !== 'number') {
                        return;
                    }

                    const a = document.createElement('a');
                    a.className = 'season';
                    a.setAttribute('role', 'listitem');
                    a.href = `episode.html?season=${encodeURIComponent(season)}&ep=${encodeURIComponent(episode.number)}`;
                    a.innerHTML = `
                        <span class="season__icon" aria-hidden="true"></span>
                        <span class="season__text">Episodio ${episode.number}</span>
                    `;
                    seasonEpisodes.appendChild(a);
                });
            }

            document.addEventListener('DOMContentLoaded', function () {
                renderEpisodes().catch(function () {
                });
            });
        })();
    </script>
    <div id="site-footer"></div>
</body>
</html>
