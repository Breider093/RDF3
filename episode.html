
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reina del Flow - Reproductor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <div id="site-header"></div>
    <main>
        <section class="player-page" aria-label="Reproductor">
            <div class="player-page__overlay"></div>
            <div class="player-page__inner container">
                <div class="lang">
                    <div class="lang__label">CASTELLANO</div>
                    <div class="lang__sub">Idioma</div>
                </div>

                <div class="player" aria-label="Video">
                    <div class="player__embed" aria-label="Reproductor embebido">
                        <iframe
                            id="playerFrame"
                            class="player__frame"
                            src=""
                            frameborder="0"
                            allow="autoplay"
                            allowfullscreen
                            referrerpolicy="no-referrer"
                            title="Reproductor">
                        </iframe>
                    </div>
                </div>

                <nav class="player-nav" aria-label="Navegación">
                    <a class="player-nav__link" id="navPrev" href="season-3.html">
                        <span class="player-nav__arrow" aria-hidden="true">&#x2190;</span>
                        <span>Anterior</span>
                    </a>
                    <a class="player-nav__center" id="navEpisodes" href="season-3.html">
                        <span class="player-nav__menu" aria-hidden="true"></span>
                        <span>Episodios</span>
                    </a>
                    <a class="player-nav__link" id="navNext" href="#">
                        <span>Siguiente</span>
                        <span class="player-nav__arrow" aria-hidden="true">&#x2192;</span>
                    </a>
                </nav>
            </div>
        </section>

        <section class="content">
            <div class="container content__inner">
                <div class="episode-header">
                    <h2 class="content__title" id="episodeTitle">Seriesflix | Ver REINA DEL FLOW Temporada 3 Episodio 1 Online</h2>
                    <div class="episode-header__social" aria-label="Redes sociales">
                        <a class="social" href="#" aria-label="Facebook">
                            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                <path fill="currentColor" d="M13.5 22v-8h2.7l.4-3H13.5V9.1c0-.9.3-1.6 1.7-1.6H16.7V4.9c-.8-.1-1.8-.2-3-.2-3 0-5 1.8-5 5.1V11H6v3h2.7v8h4.8z"/>
                            </svg>
                        </a>
                        <a class="social" href="#" aria-label="Twitter">
                            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                <path fill="currentColor" d="M22 5.9c-.7.3-1.4.5-2.2.6.8-.5 1.3-1.2 1.6-2.1-.7.4-1.5.8-2.4.9-.7-.7-1.6-1.1-2.7-1.1-2.2 0-3.8 2-3.3 4.1-3-.2-5.7-1.6-7.5-3.8-1 1.8-.5 4.1 1.2 5.4-.6 0-1.2-.2-1.7-.5 0 1.9 1.3 3.5 3.2 3.9-.5.1-1 .1-1.6.1.4 1.6 1.9 2.8 3.6 2.8-1.3 1-3 1.6-4.7 1.6H2c1.8 1.2 4 1.9 6.4 1.9 7.8 0 12.2-6.6 11.9-12.6.8-.6 1.4-1.2 1.9-2z"/>
                            </svg>
                        </a>
                        <a class="social" href="#" aria-label="WhatsApp">
                            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                <path fill="currentColor" d="M20 3.9A10 10 0 0 0 3.6 19.5L3 22l2.6-.6A10 10 0 0 0 20 3.9zm-8 16.5a8.3 8.3 0 0 1-4.2-1.1l-.3-.2-2.5.6.6-2.4-.2-.3A8.3 8.3 0 1 1 12 20.4zm4.6-6.3c-.2-.1-1.3-.6-1.5-.7s-.4-.1-.6.1-.7.7-.9.9-.3.2-.5.1a6.7 6.7 0 0 1-2-1.2 7.6 7.6 0 0 1-1.4-1.7c-.1-.2 0-.4.1-.5l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.3 0-.5s-.6-1.5-.8-2c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.2-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.7 4.4 3.8.6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.3-.5 1.5-1s.2-1 .2-1.1c0-.1-.2-.2-.4-.3z"/>
                            </svg>
                        </a>
                        <a class="social" href="#" aria-label="Telegram">
                            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                <path fill="currentColor" d="M21.9 4.6c.2-.8-.5-1.5-1.3-1.2L2.9 10.2c-.9.4-.8 1.7.1 2l4.8 1.5 1.8 5.7c.3.9 1.5 1 2 .2l2.6-4.2 4.7 3.4c.8.6 1.9.1 2.1-.9l1.9-13.4zM9.7 13l9.3-6.1-7.6 7.5-.3 3.5-1.7-5.2-.1-.3 0 0 .4-.2z"/>
                            </svg>
                        </a>
                    </div>
                </div>

                <div class="rating" aria-label="Rating">
                    <span class="rating__stars" aria-hidden="true">★★★★★</span>
                    <span class="rating__meta">2018 45min</span>
                </div>

                <p class="content__lead" id="episodeLead"></p>
                <p class="content__lead" id="episodeDesc"></p>

                <div class="hero__details">
                    <div><span class="hero__label">Director:</span> Andrés Salgado</div>
                    <div><span class="hero__label">Género:</span> Drama, Música, Romance</div>
                </div>

                <div class="episodes">
                    <div class="episodes__title">REINA DEL FLOW - Temporada 3</div>
                    <div class="episodes__list" id="episodeList" role="list"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            function getParams() {
                const params = new URLSearchParams(window.location.search);
                const season = params.get('season') || '3';
                const ep = parseInt(params.get('ep') || '1', 10);
                return { season, ep: Number.isFinite(ep) ? ep : 1 };
            }

            function buildEpisodeUrl(season, ep) {
                return `episode.html?season=${encodeURIComponent(season)}&ep=${encodeURIComponent(ep)}`;
            }

            async function load() {
                const { season, ep } = getParams();

                const navEpisodes = document.getElementById('navEpisodes');
                const navPrev = document.getElementById('navPrev');
                const navNext = document.getElementById('navNext');
                const title = document.getElementById('episodeTitle');
                const frame = document.getElementById('playerFrame');
                const episodeListEl = document.getElementById('episodeList');
                const leadEl = document.getElementById('episodeLead');
                const descEl = document.getElementById('episodeDesc');

                navEpisodes.href = `season-${season}.html`;

                const res = await fetch('data/episodes.json', { cache: 'no-store' });
                const data = await res.json();
                const seasonData = data && data.seasons && data.seasons[season];
                const list = seasonData && Array.isArray(seasonData.episodes) ? seasonData.episodes : [];

                const current = list.find((x) => x && x.number === ep) || list[0];
                const currentNumber = current && current.number ? current.number : ep;

                const currentTitle = current && current.title ? current.title : `Episodio ${currentNumber}`;
                const currentDescription = current && current.description ? current.description : '';

                title.textContent = `Seriesflix | Ver REINA DEL FLOW Temporada ${season} Episodio ${currentNumber} Online`;

                document.title = `Reina del Flow - T${season}E${currentNumber} | ${currentTitle}`;

                if (leadEl) {
                    leadEl.textContent = `Ver REINA DEL FLOW Temporada ${season} Episodio ${currentNumber} Online Gratis en HD con audio Latino, Español y Subtitulado.`;
                }
                if (descEl) {
                    descEl.textContent = currentDescription || 'Recuerda que ver episodios online nunca ha sido tan fácil. Si tienes algún problema con la serie, no dudes en informarlo.';
                }

                if (current && current.embedUrl) {
                    frame.src = current.embedUrl;
                } else {
                    frame.src = '';
                }

                if (episodeListEl) {
                    episodeListEl.innerHTML = '';
                    list.forEach((item) => {
                        if (!item || typeof item.number !== 'number') {
                            return;
                        }

                        const a = document.createElement('a');
                        a.className = 'episode-item';
                        a.setAttribute('role', 'listitem');
                        a.href = buildEpisodeUrl(season, item.number);

                        if (item.number === currentNumber) {
                            a.classList.add('episode-item--active');
                            a.setAttribute('aria-current', 'page');
                        }

                        const itemTitle = item.title ? item.title : `Episodio ${item.number}`;
                        a.innerHTML = `
                            <span class="episode-item__num">${item.number}</span>
                            <span class="episode-item__thumb" aria-hidden="true"></span>
                            <span class="episode-item__name">${itemTitle}</span>
                            <span class="episode-item__play" aria-hidden="true"></span>
                        `;

                        if (item.thumbnail) {
                            const thumbEl = a.querySelector('.episode-item__thumb');
                            if (thumbEl) {
                                thumbEl.style.backgroundImage = `url(${JSON.stringify(item.thumbnail).slice(1, -1)})`;
                            }
                        }
                        episodeListEl.appendChild(a);
                    });
                }

                const prevEp = currentNumber - 1;
                const nextEp = currentNumber + 1;

                navPrev.href = prevEp >= 1 ? buildEpisodeUrl(season, prevEp) : `season-${season}.html`;

                const hasNext = list.some((x) => x && x.number === nextEp);
                navNext.href = hasNext ? buildEpisodeUrl(season, nextEp) : `season-${season}.html`;
            }

            load().catch(function () {
            });
        })();
    </script>
    <div id="site-footer"></div>
</body>
</html>
